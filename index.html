<script>
const ITEMS = [{"id": "overview", "no": "0.1", "group": "负责人综述", "dept": "业务负责人", "kind": "text", "prompt": "业务概述", "hint": "城市、品牌、新机和二手如何区分、合同是不是分期买卖、团队主要在哪些城市。"}, {"id": "team", "no": "0.6", "group": "负责人综述", "dept": "业务负责人", "kind": "text", "prompt": "团队背景与境内业务", "hint": "核心成员的从业经历和职责。境内是否有同类分期，主体、城市、规模，以及与展业地借款主体、担保主体的关系。没有境内业务写无。"}, {"id": "outlook", "no": "0.2", "group": "负责人综述", "dept": "业务负责人", "kind": "text", "prompt": "未来 12 个月的发展规划", "hint": "品牌、门店、月放款台数。已签约尚未放量的品牌请单独写。二手是否扩大也请说明。"}, {"id": "kpi", "no": "0.3", "group": "负责人综述", "dept": "业务负责人", "kind": "text", "prompt": "核心业务指标", "hint": "列出内部平时盯的指标，并给最近一个完整月末的数。请注明币种和统计口径。例如月放款台数、在贷余额、件均、期限、审批通过率、不良、终损、品牌搭载率。"}, {"id": "whyraise", "no": "0.4", "group": "负责人综述", "dept": "业务负责人", "kind": "text", "prompt": "融资用途", "hint": "自有资金和已有借款覆盖不到的部分：在贷增长、新品牌放量，或其他用途。"}, {"id": "howmuch", "no": "0.5", "group": "负责人综述", "dept": "业务负责人", "kind": "text", "prompt": "拟融资金额", "hint": "金额、币种、期限，以及希望什么时候开始用。若与财务在「这次用款」里的额度不同，请注明以哪一个为准。"}, {"id": "eq", "no": "1.1", "group": "一、主体与牌照", "dept": "法务", "kind": "both", "prompt": "股权架构图", "hint": "借款主体和担保主体分开列，不要合成一家。借款主体是持有牌照或不反对函、本次作为借款人的公司。担保主体是提供保证的集团公司或其他公司。同时列对客签约、品牌签约、收款主体。写注册地、持股比例和实控人。可上传架构图。"}, {"id": "parties", "no": "1.1a", "group": "一、主体与牌照", "dept": "法务", "kind": "text", "prompt": "借款主体与担保主体", "hint": "借款主体：全称、注册地、持有的牌照或不反对函。担保主体：全称、注册地、与借款主体的股权关系。多家担保的逐家写。两家的报表、负债和对外担保分开。"}, {"id": "reg", "no": "1.2", "group": "一、主体与牌照", "dept": "法务", "kind": "file", "prompt": "展业地公司注册文件、章程、董事及签字权", "hint": ""}, {"id": "noc", "no": "1.3", "group": "一、主体与牌照", "dept": "法务", "kind": "both", "prompt": "央行不反对函", "hint": "请附原文和译文，并写明出具机关、日期、允许的业务、有效期、可撤销条件。"}, {"id": "paylic", "no": "1.4", "group": "一、主体与牌照", "dept": "法务", "kind": "both", "prompt": "正在申请的支付许可", "hint": "请附申请书和受理回执，写预计获批时间。说明覆盖代收、代付，还是只供自身分期回款。名称以申请文件为准。"}, {"id": "cap", "no": "1.5", "group": "一、主体与牌照", "dept": "法务", "kind": "text", "prompt": "定价与信贷实质", "hint": "规定或指引名称。加价、月费、手续费、押金哪些计入上限。若监管按信贷实质衡量分期买卖，写明穿透口径和贵司的对应结果。不要求另行出具法律意见。"}, {"id": "cashout", "no": "1.5a", "group": "一、主体与牌照", "dept": "法务", "kind": "text", "prompt": "套现的规定和认定", "hint": "当地对以手机分期套取现金的规定。贵司如何认定：不要机器、当场转卖、拆机卖零件、首付异常、同一收款账户集中。近 12 个月认定的笔数、金额和处理。"}, {"id": "contracts", "no": "1.6", "group": "一、主体与牌照", "dept": "法务", "kind": "both", "prompt": "C 端协议全套", "hint": "客户实际签署的全部文件，不要只给分期买卖合同。按实际在售期限各附一份合同和还款计划，另附锁机与解锁授权、个人信息授权、代扣或钱包授权、交付确认。另有押金、提前结清、用户协议或隐私政策的一并附上。二手另有成色或货权确认的，单独附上。标明签署时点，以及所有权转移、锁机、解除、取回、违约金、提前结清写在哪一份、哪一条。"}, {"id": "storeagree", "no": "1.7", "group": "一、主体与牌照", "dept": "运营", "kind": "file", "prompt": "与店主、与导购的协议范本", "hint": ""}, {"id": "fs", "no": "1.8", "group": "一、主体与牌照", "dept": "财务", "kind": "both", "prompt": "近 12 个月报表、纳税申报和主要银行流水", "hint": "借款主体、担保主体各自提供。有审计报告的上传审计报告，没有则给管理报表。对外担保和关联方往来按主体分开。"}, {"id": "rule", "no": "2.0", "group": "产品", "dept": "财务", "kind": "text", "prompt": "标准息费规则", "hint": "按实际在售产品分行。与获客来源、机型结构、成交渠道分开填列，也不要套成 3、6、9 期。每种期限、新机或二手各写加价、月费、手续费、押金的规则和基数。月费按放款额还是成交价。"}, {"id": "shape", "no": "2.0b", "group": "产品", "dept": "财务", "kind": "both", "prompt": "现金流形态", "hint": "客户按期偿还、不提前结清时，每一期收回的本金、息费和期末剩余本金。以放款本金 100 为基数。期次按该产品的期限逐期填写。"}, {"id": "prepayRule", "no": "2.0c", "group": "产品", "dept": "财务", "kind": "text", "prompt": "提前还款", "hint": "是否接受。最早可在哪一期提出。已到期息费、未到期息费、违约金、押金分别怎么处理，写出计算公式。不接受的写不接受。"}, {"id": "cfmodel", "no": "2.0d", "group": "产品", "dept": "财务", "kind": "file", "prompt": "现金流模型", "hint": "标准规则下的逐期现金流，以及提前还款后的重算结果。模型假设写明放款本金、期限、是否含提前还款。输出应与现金流形态一致。"}, {"id": "price", "no": "2.1", "group": "二、单笔交易", "dept": "运营", "kind": "text", "prompt": "标价、成交价、加价", "hint": "用一笔已放款且至少还过一期的真实订单，客户信息脱敏。写明加价记在谁的收入里。该笔适用的产品规则与「标准息费规则」一致。"}, {"id": "dp", "no": "2.2", "group": "二、单笔交易", "dept": "财务", "kind": "text", "prompt": "首付比例和金额，付给谁，哪一天进账", "hint": ""}, {"id": "advance", "no": "2.3", "group": "二、单笔交易", "dept": "财务", "kind": "both", "prompt": "当天垫付给店主的金额", "hint": "基数是进货价、零售价还是加价后的价格。请对上银行回单。"}, {"id": "deposit", "no": "2.4", "group": "二、单笔交易", "dept": "财务", "kind": "text", "prompt": "押金", }
function persist() {
  localStorage.setItem(KEY, JSON.stringify(saved));

  root.querySelectorAll("button.submit").forEach(btn => {
    btn.addEventListener("click", () => {
      const group = btn.dataset.group;
      const picked = rows.filter(item => {
        if (group && item.group !== group) return false;
        return (saved[item.id] || "").trim().length > 0;
      });
      if (!picked.length) { alert("这一范围还没有填写内容。"); return; }
      const who = role === "全部" ? (group || "清单") : (role === "业务负责人" ? "负责人" : role);
      const lines = [`手机分期尽调`, `角色：${who}`, `时间：${new Date().toLocaleString("zh-CN", { hour12: false })}`, ""];
      picked.forEach(item => {
        lines.push(`${item.no} ${item.prompt}`);
        lines.push(saved[item.id].trim());
        lines.push("");
      });
      const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "");
      a.href = URL.createObjectURL(blob);
      a.download = `手机分期尽调-${who}-${stamp}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
  });
}
render();
</script>
</body>
</html>
